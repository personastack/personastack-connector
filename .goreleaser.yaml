version: 2

project_name: personastack-connector

before:
  hooks:
    - go mod tidy

builds:
  - id: personastack-connector
    main: ./cmd/personastack-connector
    binary: personastack-connector
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows/arm64 remains excluded until signing, installer behavior,
      # credential storage, and runtime probes are proven.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/personastack/personastack-connector/internal/buildinfo.Version={{ .Version }}
      - -X github.com/personastack/personastack-connector/internal/buildinfo.GitCommit={{ .Commit }}
      - -X github.com/personastack/personastack-connector/internal/buildinfo.BuildDate={{ .Date }}
      - -X github.com/personastack/personastack-connector/internal/buildinfo.ReleaseChannel=stable
    hooks:
      post:
        - cmd: ./scripts/sign-windows-binary.sh "{{ .Path }}"
          output: true

notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_SIGN_PASSWORD") (isEnvSet "MACOS_NOTARY_ISSUER_ID") (isEnvSet "MACOS_NOTARY_KEY_ID") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids:
        - personastack-connector
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true

archives:
  - id: default
    ids:
      - personastack-connector
    name_template: >-
      personastack-connector_{{ .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    format_overrides:
      - goos: windows
        formats:
          - zip

nfpms:
  - id: linux-packages
    ids:
      - personastack-connector
    package_name: personastack-connector
    vendor: PersonaStack
    homepage: https://personastack.ai
    maintainer: PersonaStack <security@personastack.ai>
    description: User-installed Connector for PersonaStack external personas.
    license: Proprietary
    formats:
      - deb
      - rpm
    bindir: /usr/local/bin
    contents:
      - src: README.md
        dst: /usr/share/doc/personastack-connector/README.md
      - src: SPEC.md
        dst: /usr/share/doc/personastack-connector/SPEC.md

checksum:
  name_template: personastack-connector_{{ .Version }}_checksums.txt
  algorithm: sha256

signs:
  - id: checksum-bundle
    cmd: ./scripts/sign-release-checksum-bundle.sh
    args:
      - ${artifact}
      - ${signature}
    signature: "${artifact}.sigstore.json"
    artifacts: checksum

sboms:
  - artifacts: archive
    documents:
      - "{{ .ProjectName }}_{{ .Version }}_sbom.spdx.json"

release:
  github:
    owner: personastack
    name: personastack-connector
  draft: true
  mode: replace
