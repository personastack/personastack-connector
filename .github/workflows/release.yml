name: release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Race tests
        run: go test -race ./internal/bridge ./internal/daemon ./internal/mcp
      - name: Vet
        run: go vet ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: License file
        run: test -s LICENSE

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Check release policy
        run: ./scripts/check-release-policy.sh
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release package smoke
        run: ./scripts/smoke-release-artifacts.sh dist "${GITHUB_REF_NAME#v}"
      - name: Build release manifest
        run: go run ./cmd/release-manifest --dist dist --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" --output "dist/personastack-connector_${GITHUB_REF_NAME#v}_release_manifest.json"
      - name: Check release manifest checksum
        run: sha256sum "dist/personastack-connector_${GITHUB_REF_NAME#v}_release_manifest.json" > "dist/personastack-connector_${GITHUB_REF_NAME#v}_release_manifest.json.sha256"
      - name: Verify release manifest checksum
        run: ./scripts/verify-release-manifest.sh dist "${GITHUB_REF_NAME#v}"
      - name: Upload release manifest
        run: gh release upload "$GITHUB_REF_NAME" "dist/personastack-connector_${GITHUB_REF_NAME#v}_release_manifest.json" "dist/personastack-connector_${GITHUB_REF_NAME#v}_release_manifest.json.sha256" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest artifacts
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: "dist/*"
