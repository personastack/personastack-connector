name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      PERSONASTACK_CONNECTOR_KEYRING_MOCK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go list ./... | xargs -n 1 -P 8 go test -parallel 16 -timeout 30m
      - name: Format
        run: git ls-files '*.go' ':!:vendor/*' | xargs gofmt -l | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - name: Race tests
        run: printf '%s\n' ./internal/bridge ./internal/daemon ./internal/mcp | xargs -n 1 -P 3 go test -race -parallel 8 -timeout 30m
      - name: Vet
        run: go vet ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: License file
        run: test -s LICENSE

  runtime-smoke:
    name: runtime smoke (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Fake runtime smoke
        run: ./scripts/fake-runtime-smoke.sh
        shell: bash

  release-dry-run:
    name: release dry-run
    runs-on: ubuntu-latest
    needs:
      - test
      - runtime-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: check
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Snapshot artifacts
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --skip=publish
      - name: Snapshot package smoke
        run: ./scripts/smoke-release-artifacts.sh dist auto
      - name: Snapshot release manifest
        run: go run ./cmd/release-manifest --dist dist --version snapshot --commit "$GITHUB_SHA" --output dist/personastack-connector_snapshot_release_manifest.json
